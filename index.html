<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XY.com – Te csak mondd, mire van szükséged.</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f5;color:#171717}
header{background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:0;z-index:5}
.wrap{max-width:1100px;margin:auto;padding:0 22px}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:26px;font-weight:800;letter-spacing:-1px}
.cartBtn{border:0;background:#171717;color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer}
.hero{padding:72px 0 48px}.hero h1{font-size:48px;line-height:1.03;letter-spacing:-2px;max-width:650px;margin:0 0 18px}
.hero p{font-size:19px;color:#666;max-width:620px;margin:0}
.search{margin:20px 0 34px;display:flex;gap:10px}.search input{flex:1;border:1px solid #ddd;border-radius:14px;padding:15px 16px;font-size:16px;background:#fff}.search button{border:0;border-radius:14px;background:#171717;color:#fff;padding:0 22px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;padding-bottom:60px}
.card{background:#fff;border:1px solid #e7e7e7;border-radius:20px;padding:20px;display:flex;flex-direction:column;min-height:245px}
.tag{font-size:12px;color:#777;margin-bottom:10px}.card h3{font-size:18px;line-height:1.2;margin:0 0 14px}.price{font-size:21px;font-weight:800;margin-top:auto}.stock{font-size:13px;color:#777;margin:6px 0 14px}
.add{border:0;border-radius:12px;background:#171717;color:#fff;padding:12px;font-weight:700;cursor:pointer}.add:disabled{opacity:.45;cursor:not-allowed}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}.drawer.open{display:block}
.panel{position:absolute;right:0;top:0;height:100%;width:min(440px,100%);background:#fff;padding:25px;overflow:auto}
.panelTop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:20px}
.line{padding:18px 0;border-bottom:1px solid #eee}.lineTop{display:flex;justify-content:space-between;gap:10px}.qty{display:flex;align-items:center;gap:8px;margin-top:10px}.qty button{border:1px solid #ddd;background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:25px 0}
.confirm{width:100%;border:0;border-radius:13px;background:#171717;color:#fff;padding:15px;font-weight:800;cursor:pointer}.confirm:disabled{opacity:.4;cursor:not-allowed}
.notice{margin-top:12px;padding:12px;border-radius:10px;background:#f1f1ef;font-size:13px;display:none}.notice.show{display:block}
.empty{color:#777;padding:30px 0}
@media(max-width:600px){.hero{padding-top:45px}.hero h1{font-size:38px}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="logo">XY.com</div>
  <button class="cartBtn" onclick="openCart()">Kosár <span id="cartCount">0</span></button>
</div></header>

<main class="wrap">
<section class="hero">
  <h1>Te csak mondd, mire van szükséged.</h1>
  <p>Egyszerű bevásárlás. Az XY.com API-val összekötött demo kosárral.</p>
</section>

<div class="search">
  <input id="q" placeholder="Keress pl. Ariel, kávé..." onkeydown="if(event.key==='Enter')search()">
  <button onclick="search()">Keresés</button>
</div>

<div id="status" class="notice"></div>
<section id="grid" class="grid"></section>
</main>

<div id="drawer" class="drawer" onclick="if(event.target===this)closeCart()">
 <aside class="panel">
  <div class="panelTop"><h2>Kosár</h2><button class="close" onclick="closeCart()">×</button></div>
  <div id="cartLines"></div>
  <div class="total"><span>Összesen</span><span id="cartTotal">0 Ft</span></div>
  <button id="confirm" class="confirm" onclick="confirmOrder()">Rendelés véglegesítése</button>
  <div id="cartNotice" class="notice"></div>
 </aside>
</div>

<script>
const API = "https://xymcp.onrender.com";
const API_KEY = "xy-demo-key-123"; // Termékkereséshez és demo kosárhoz jelenleg nem kell kulcs.
let cartToken = localStorage.getItem("xy_cart_token") || null;
let products = [];

function money(n){return new Intl.NumberFormat("hu-HU").format(n)+" Ft"}
function notice(msg, el="status"){const x=document.getElementById(el);x.textContent=msg;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),3500)}
async function req(path, opts={}){
  const headers = {"Content-Type":"application/json", ...(opts.headers||{})};
  if(API_KEY) headers["X-API-Key"]=API_KEY;
  const r=await fetch(API+path,{...opts,headers});
  if(!r.ok){let d={};try{d=await r.json()}catch{};throw new Error(d.detail||("HTTP "+r.status))}
  return r.json();
}
async function search(){
  const q=document.getElementById("q").value.trim();
  try{
    const data=await req("/api/products"+(q?"?q="+encodeURIComponent(q):""));
    products=data.products||[];
    renderProducts();
  }catch(e){notice("Nem sikerült lekérni a termékeket: "+e.message)}
}
function renderProducts(){
  const g=document.getElementById("grid");
  if(!products.length){g.innerHTML="<div class='empty'>Nincs találat.</div>";return}
  g.innerHTML=products.map(p=>`<article class="card">
    <div class="tag">${escapeHtml(p.brand||"")} · ${escapeHtml(p.category||"")}</div>
    <h3>${escapeHtml(p.name)}</h3>
    <div class="price">${money(p.price)}</div>
    <div class="stock">Készlet: ${p.stock} db</div>
    <button class="add" onclick="add(${p.id})" ${p.stock<1?"disabled":""}>Kosárba</button>
  </article>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function ensureCart(){
  if(cartToken)return cartToken;
  const data=await req("/api/carts",{method:"POST"});
  cartToken=data.cart_token;
  localStorage.setItem("xy_cart_token",cartToken);
  return cartToken;
}
async function add(id){
  try{
    const token=await ensureCart();
    const data=await req(`/api/carts/${token}/items`,{method:"POST",body:JSON.stringify({product_id:id,quantity:1})});
    renderCart(data);
    openCart();
    notice("Termék hozzáadva a kosárhoz.");
  }catch(e){notice("Nem sikerült a kosárba tenni: "+e.message)}
}
async function loadCart(){
  if(!cartToken){renderCart({items:[],total:0});return}
  try{renderCart(await req(`/api/carts/${cartToken}`))}
  catch(e){
    localStorage.removeItem("xy_cart_token");cartToken=null;
    renderCart({items:[],total:0});
  }
}
function renderCart(data){
  const lines=document.getElementById("cartLines");
  const items=data.items||[];
  document.getElementById("cartCount").textContent=items.reduce((s,i)=>s+i.quantity,0);
  document.getElementById("cartTotal").textContent=money(data.total||0);
  document.getElementById("confirm").disabled=!items.length;
  if(!items.length){lines.innerHTML="<div class='empty'>A kosár üres.</div>";return}
  lines.innerHTML=items.map(i=>`<div class="line">
    <div class="lineTop"><strong>${escapeHtml(i.name)}</strong><strong>${money(i.line_total)}</strong></div>
    <div class="qty">
      <button onclick="changeQty(${i.product_id},${i.quantity-1})">−</button>
      <span>${i.quantity} db</span>
      <button onclick="changeQty(${i.product_id},${i.quantity+1})">+</button>
    </div>
  </div>`).join("");
}
async function changeQty(id,q){
  try{
    if(q<=0){
      await req(`/api/carts/${cartToken}/items/${id}`,{method:"DELETE"});
    }else{
      await req(`/api/carts/${cartToken}/items/${id}`,{method:"PATCH",body:JSON.stringify({quantity:q})});
    }
    await loadCart();
  }catch(e){notice(e.message,"cartNotice")}
}
async function confirmOrder(){
  if(!cartToken)return;
  if(!confirm("Biztosan véglegesíted a rendelést?"))return;
  try{
    const order=await req(`/api/carts/${cartToken}/confirm`,{method:"POST"});
    document.getElementById("cartNotice").textContent="Rendelés létrehozva: "+order.order_id+" · "+money(order.total);
    document.getElementById("cartNotice").classList.add("show");
    localStorage.removeItem("xy_cart_token");cartToken=null;
    renderCart({items:[],total:0});
  }catch(e){notice(e.message,"cartNotice")}
}
function openCart(){document.getElementById("drawer").classList.add("open");loadCart()}
function closeCart(){document.getElementById("drawer").classList.remove("open")}
search();
</script>
</body>
</html>
